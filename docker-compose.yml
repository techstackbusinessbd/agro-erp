version: '3.8'
services:
  # Laravel App [cite: 19-20]
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agro-app
    # Updated working directory to point inside backend
    working_dir: /var/www/backend
    volumes:
      # Map the whole project but Laravel runs from /backend
      - ./:/var/www
    networks:
      - agro-network

  # Nginx Web Server [cite: 397-398]
  webserver:
    image: nginx:alpine
    container_name: agro-webserver
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      # Nginx config mounting
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - agro-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: agro-db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - agro-network

  # Redis for Queue & Caching
  redis:
    image: redis:alpine
    container_name: agro-redis
    networks:
      - agro-network

  # Laravel Horizon for Queue Monitoring
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agro-horizon
    # Updated command to run inside backend
    command: php artisan horizon
    working_dir: /var/www/backend
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
    networks:
      - agro-network

networks:
  agro-network:
    driver: bridge